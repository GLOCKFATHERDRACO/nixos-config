name: Format

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  alejandra:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix run nixpkgs#alejandra -- --check .
